<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGradU" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141d32"/>
      <stop offset="55%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>

    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlowU" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="amberCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="titleGradU" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="glassFillU" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.84"/>
    </linearGradient>

    <linearGradient id="borderAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="neonGlowU" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="24" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlowU" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="gridU" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1280" height="720" fill="url(#bgGradU)"/>
  <rect width="1280" height="720" fill="url(#gridU)"/>

  <!-- Ambient Neon Orbs -->
  <circle cx="580" cy="260" r="330" fill="url(#amberGlow)"/>
  <circle cx="750" cy="340" r="310" fill="url(#cyanGlowU)"/>
  <circle cx="160" cy="220" r="220" fill="url(#amberGlow)" opacity="0.55"/>
  <circle cx="1120" cy="480" r="240" fill="url(#cyanGlowU)" opacity="0.65"/>

  <!-- Subtle Perspective Floor Grid -->
  <g opacity="0.22" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="600" x2="1280" y2="600" stroke-opacity="0.22"/>
    <line x1="0" y1="636" x2="1280" y2="636" stroke-opacity="0.28"/>
    <line x1="0" y1="680" x2="1280" y2="680" stroke-opacity="0.34"/>
    <line x1="640" y1="540" x2="90" y2="720" stroke-opacity="0.2"/>
    <line x1="640" y1="540" x2="350" y2="720" stroke-opacity="0.2"/>
    <line x1="640" y1="540" x2="640" y2="720" stroke-opacity="0.25"/>
    <line x1="640" y1="540" x2="930" y2="720" stroke-opacity="0.2"/>
    <line x1="640" y1="540" x2="1190" y2="720" stroke-opacity="0.2"/>
  </g>

  <!-- Connecting Neon Circuit Traces -->
  <path d="M 358 290 L 465 290 L 500 250 L 520 250" fill="none" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="2" filter="url(#softGlowU)"/>
  <path d="M 922 290 L 815 290 L 780 250 L 760 250" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2" filter="url(#softGlowU)"/>

  <!-- Left Floating Glass Card: Task Manager & To-Do -->
  <g transform="translate(68, 175)">
    <rect width="290" height="270" rx="22" fill="url(#glassFillU)" stroke="url(#borderAmber)" stroke-width="1.6"/>
    <circle cx="24" cy="24" r="5" fill="#f43f5e"/>
    <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>
    <text x="80" y="29" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">TO-DO MANAGER</text>
    <line x1="20" y1="46" x2="270" y2="46" stroke="#334155" stroke-opacity="0.6"/>

    <!-- Checklist Items -->
    <g transform="translate(22, 66)">
      <rect width="246" height="40" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4"/>
      <rect x="12" y="10" width="20" height="20" rx="5" fill="#10b981" fill-opacity="0.25" stroke="#34d399"/>
      <path d="M 17 20 L 21 24 L 28 16" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="25" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">CRUD LocalStorage Sync</text>
    </g>

    <g transform="translate(22, 118)">
      <rect width="246" height="40" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.4"/>
      <rect x="12" y="10" width="20" height="20" rx="5" fill="#f59e0b" fill-opacity="0.25" stroke="#fbbf24"/>
      <path d="M 17 20 L 21 24 L 28 16" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="25" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">BMI Health Calculator</text>
    </g>

    <g transform="translate(22, 170)">
      <rect width="246" height="40" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.4"/>
      <rect x="12" y="10" width="20" height="20" rx="5" fill="#06b6d4" fill-opacity="0.25" stroke="#22d3ee"/>
      <path d="M 17 20 L 21 24 L 28 16" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="25" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">Scientific Calculator UI</text>
    </g>

    <text x="24" y="242" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">4 / 4 APPS SHIPPED</text>
    <text x="266" y="242" text-anchor="end" fill="#fbbf24" font-family="Consolas, monospace" font-size="11" font-weight="700">100%</text>
  </g>

  <!-- Right Floating Glass Card: Countdown Timer & Calculator -->
  <g transform="translate(922, 175)">
    <rect width="290" height="270" rx="22" fill="url(#glassFillU)" stroke="url(#borderCyan)" stroke-width="1.6"/>
    <circle cx="24" cy="24" r="5" fill="#22d3ee"/>
    <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>
    <text x="80" y="29" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">TIMER &amp; CALC</text>
    <line x1="20" y1="46" x2="270" y2="46" stroke="#334155" stroke-opacity="0.6"/>

    <!-- Neon Countdown Dial -->
    <g transform="translate(145, 134)">
      <circle cx="0" cy="0" r="62" fill="#0f172a" stroke="#1e293b" stroke-width="9"/>
      <circle cx="0" cy="0" r="62" fill="none" stroke="url(#amberCyanGrad)" stroke-width="9" stroke-dasharray="295 390" stroke-linecap="round" transform="rotate(-90)" filter="url(#softGlowU)"/>
      <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="Consolas, monospace" font-size="26" font-weight="800">04:59</text>
      <text x="0" y="28" text-anchor="middle" fill="#22d3ee" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">PRECISION</text>
    </g>

    <!-- Bottom Pill Badges -->
    <g transform="translate(22, 214)">
      <rect width="116" height="32" rx="9" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.4"/>
      <text x="58" y="21" text-anchor="middle" fill="#fcd34d" font-family="Consolas, monospace" font-size="11" font-weight="700">ES6+ JS</text>

      <rect x="130" width="116" height="32" rx="9" fill="#06b6d4" fill-opacity="0.14" stroke="#06b6d4" stroke-opacity="0.4"/>
      <text x="188" y="21" text-anchor="middle" fill="#67e8f9" font-family="Consolas, monospace" font-size="11" font-weight="700">REACT UI</text>
    </g>
  </g>

  <!-- CENTERPIECE 4-TILE BENTO LOGO EMBLEM -->
  <g transform="translate(640, 245)">
    <!-- Outer Glowing Hexagon/Rounded Square Container -->
    <rect x="-112" y="-112" width="224" height="224" rx="46" fill="#0b101d" fill-opacity="0.88" stroke="url(#amberCyanGrad)" stroke-width="3.5" filter="url(#neonGlowU)"/>

    <!-- Tile 1 (Top-Left): Checkmark / To-Do -->
    <rect x="-80" y="-80" width="70" height="70" rx="18" fill="#10b981" fill-opacity="0.14" stroke="#34d399" stroke-width="2.5"/>
    <path d="M -58 -44 L -48 -34 L -28 -56" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlowU)"/>

    <!-- Tile 2 (Top-Right): Countdown Clock Dial -->
    <rect x="10" y="-80" width="70" height="70" rx="18" fill="#f59e0b" fill-opacity="0.14" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="45" cy="-45" r="20" fill="none" stroke="#fbbf24" stroke-width="4" filter="url(#softGlowU)"/>
    <path d="M 45 -57 L 45 -45 L 54 -40" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tile 3 (Bottom-Left): BMI Pulse / Health -->
    <rect x="-80" y="10" width="70" height="70" rx="18" fill="#06b6d4" fill-opacity="0.14" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M -66 46 L -54 46 L -47 30 L -38 60 L -30 46 L -22 46" fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlowU)"/>

    <!-- Tile 4 (Bottom-Right): Calculator Plus/Equals -->
    <rect x="10" y="10" width="70" height="70" rx="18" fill="#3b82f6" fill-opacity="0.16" stroke="#60a5fa" stroke-width="2.5"/>
    <path d="M 28 34 L 44 34 M 36 26 L 36 42" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 48 54 L 64 54 M 48 63 L 64 63" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" filter="url(#softGlowU)"/>
  </g>

  <!-- BOLD BRAND TYPOGRAPHY -->
  <text x="640" y="445" text-anchor="middle" font-family="'Segoe UI', Outfit, Inter, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="3">
    <tspan fill="#ffffff">DEV </tspan>
    <tspan fill="url(#titleGradU)">UTILITIES</tspan>
  </text>

  <!-- Subtitle -->
  <text x="640" y="492" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="6.5">
    INTERACTIVE WEB APPS SUITE
  </text>

  <!-- Subtle Bottom Accent Pill -->
  <rect x="520" y="516" width="240" height="3" rx="1.5" fill="url(#titleGradU)" opacity="0.85"/>
</svg>
