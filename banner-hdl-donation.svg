<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background & Ambient Glow Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#131c31"/>
      <stop offset="55%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#060911"/>
    </radialGradient>

    <radialGradient id="crimsonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="logoStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="dropGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="45%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0"/>
      <stop offset="25%" stop-color="#f43f5e" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.82"/>
    </linearGradient>

    <linearGradient id="glassBorderLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="glassBorderRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="neonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="techGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#techGrid)"/>

  <!-- Ambient Neon Orbs -->
  <circle cx="560" cy="270" r="320" fill="url(#crimsonGlow)"/>
  <circle cx="760" cy="360" r="300" fill="url(#emeraldGlow)"/>
  <circle cx="180" cy="180" r="220" fill="url(#crimsonGlow)" opacity="0.6"/>
  <circle cx="1100" cy="540" r="240" fill="url(#emeraldGlow)" opacity="0.7"/>

  <!-- Subtle Perspective Floor Grid -->
  <g opacity="0.22" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="600" x2="1280" y2="600" stroke-opacity="0.25"/>
    <line x1="0" y1="635" x2="1280" y2="635" stroke-opacity="0.3"/>
    <line x1="0" y1="678" x2="1280" y2="678" stroke-opacity="0.35"/>
    <line x1="640" y1="540" x2="80" y2="720" stroke-opacity="0.2"/>
    <line x1="640" y1="540" x2="340" y2="720" stroke-opacity="0.2"/>
    <line x1="640" y1="540" x2="640" y2="720" stroke-opacity="0.25"/>
    <line x1="640" y1="540" x2="940" y2="720" stroke-opacity="0.2"/>
    <line x1="640" y1="540" x2="1200" y2="720" stroke-opacity="0.2"/>
  </g>

  <!-- Glowing ECG Heartbeat Pulse Trail -->
  <path d="M 0 565 L 250 565 L 285 565 L 308 518 L 332 608 L 356 492 L 382 585 L 405 565 L 875 565 L 902 522 L 926 604 L 950 502 L 976 582 L 998 565 L 1280 565"
        fill="none" stroke="url(#ecgGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" opacity="0.85"/>

  <!-- Left Floating Glassmorphism UI Card: Blood Donor Network -->
  <g transform="translate(68, 175)">
    <rect width="290" height="270" rx="22" fill="url(#glassFill)" stroke="url(#glassBorderLeft)" stroke-width="1.6"/>
    <!-- Card Top Dots -->
    <circle cx="24" cy="24" r="5" fill="#f43f5e"/>
    <circle cx="42" cy="24" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="24" r="5" fill="#10b981"/>
    <text x="80" y="29" fill="#94a3b8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">DONOR NETWORK</text>
    <line x1="20" y1="46" x2="270" y2="46" stroke="#334155" stroke-opacity="0.6"/>

    <!-- Blood Type Badges -->
    <text x="24" y="74" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="600">URGENT BLOOD GROUPS</text>
    <g transform="translate(24, 90)">
      <rect width="54" height="42" rx="10" fill="#f43f5e" fill-opacity="0.16" stroke="#f43f5e" stroke-opacity="0.55"/>
      <text x="27" y="27" text-anchor="middle" fill="#fda4af" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800">O+</text>

      <rect x="64" width="54" height="42" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="91" y="27" text-anchor="middle" fill="#6ee7b7" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800">A+</text>

      <rect x="128" width="54" height="42" rx="10" fill="#06b6d4" fill-opacity="0.14" stroke="#06b6d4" stroke-opacity="0.5"/>
      <text x="155" y="27" text-anchor="middle" fill="#67e8f9" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800">B+</text>

      <rect x="192" width="54" height="42" rx="10" fill="#f43f5e" fill-opacity="0.16" stroke="#f43f5e" stroke-opacity="0.55"/>
      <text x="219" y="27" text-anchor="middle" fill="#fda4af" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800">AB-</text>
    </g>

    <!-- Metric Bars -->
    <text x="24" y="164" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600">ACTIVE DONOR MATCHES</text>
    <text x="266" y="164" text-anchor="end" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">98.4%</text>
    <rect x="24" y="175" width="242" height="9" rx="4.5" fill="#1e293b"/>
    <rect x="24" y="175" width="215" height="9" rx="4.5" fill="url(#titleGrad)"/>

    <!-- Status Row -->
    <rect x="24" y="205" width="242" height="42" rx="12" fill="#0f172a" stroke="#10b981" stroke-opacity="0.35"/>
    <circle cx="44" cy="226" r="5" fill="#10b981" filter="url(#softGlow)"/>
    <text x="60" y="230" fill="#e2e8f0" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">Verified Auth &amp; Security</text>
  </g>

  <!-- Right Floating Glassmorphism UI Card: HDL Drugs Portal -->
  <g transform="translate(922, 175)">
    <rect width="290" height="270" rx="22" fill="url(#glassFill)" stroke="url(#glassBorderRight)" stroke-width="1.6"/>
    <circle cx="24" cy="24" r="5" fill="#10b981"/>
    <circle cx="42" cy="24" r="5" fill="#06b6d4"/>
    <circle cx="60" cy="24" r="5" fill="#3b82f6"/>
    <text x="80" y="29" fill="#94a3b8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">HDL DRUGS MODULE</text>
    <line x1="20" y1="46" x2="270" y2="46" stroke="#334155" stroke-opacity="0.6"/>

    <!-- Medicine List Rows -->
    <g transform="translate(22, 66)">
      <rect width="246" height="46" rx="12" fill="#0f172a" stroke="#334155"/>
      <rect x="12" y="11" width="24" height="24" rx="7" fill="#10b981" fill-opacity="0.18"/>
      <path d="M 24 16 L 24 30 M 17 23 L 31 23" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
      <text x="48" y="22" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700">Medicine Donation</text>
      <text x="48" y="37" fill="#64748b" font-family="Consolas, monospace" font-size="10">Cairo Regional Hub</text>
      <text x="234" y="27" text-anchor="end" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700">LIVE</text>
    </g>

    <g transform="translate(22, 124)">
      <rect width="246" height="46" rx="12" fill="#0f172a" stroke="#334155"/>
      <rect x="12" y="11" width="24" height="24" rx="7" fill="#f43f5e" fill-opacity="0.18"/>
      <circle cx="24" cy="23" r="6" fill="#fb7185"/>
      <text x="48" y="22" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700">Emergency Requests</text>
      <text x="48" y="37" fill="#64748b" font-family="Consolas, monospace" font-size="10">24/7 Rapid Dispatch</text>
      <text x="234" y="27" text-anchor="end" fill="#fb7185" font-family="Consolas, monospace" font-size="11" font-weight="700">FAST</text>
    </g>

    <g transform="translate(22, 182)">
      <rect width="246" height="62" rx="12" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3"/>
      <text x="16" y="25" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">IT-MARTIAN FRONT-END</text>
      <text x="16" y="47" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">HTML5 • CSS3 • JavaScript</text>
    </g>
  </g>

  <!-- CENTERPIECE PROFESSIONAL LOGO EMBLEM -->
  <g transform="translate(640, 250)">
    <!-- Outer Glowing Ring -->
    <circle cx="0" cy="0" r="118" fill="#0b101d" fill-opacity="0.85" stroke="url(#logoStroke)" stroke-width="3" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="#10b981" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="10 8"/>

    <!-- Medical Shield Shape -->
    <path d="M 0 -76 L 62 -50 L 62 4 C 62 46 34 74 0 88 C -34 74 -62 46 -62 4 L -62 -50 Z"
          fill="#0f172a" stroke="url(#logoStroke)" stroke-width="4" stroke-linejoin="round" filter="url(#softGlow)"/>

    <!-- Blood Drop Inside Shield -->
    <path d="M 0 -46 C 0 -46 38 -2 38 22 C 38 43 21 60 0 60 C -21 60 -38 43 -38 22 C -38 -2 0 -46 0 -46 Z"
          fill="url(#dropGrad)" filter="url(#softGlow)"/>

    <!-- Crisp White Medical Cross Inside Blood Drop -->
    <rect x="-7" y="4" width="14" height="36" rx="3.5" fill="#ffffff"/>
    <rect x="-18" y="15" width="36" height="14" rx="3.5" fill="#ffffff"/>
  </g>

  <!-- BOLD BRAND TYPOGRAPHY -->
  <text x="640" y="445" text-anchor="middle" font-family="'Segoe UI', Outfit, Inter, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="3">
    <tspan fill="#ffffff">HDL </tspan>
    <tspan fill="url(#titleGrad)">DONATION</tspan>
  </text>

  <!-- Subtitle -->
  <text x="640" y="492" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="6.5">
    BLOOD &amp; MEDICINE PLATFORM
  </text>

  <!-- Subtle Bottom Accent Pill -->
  <rect x="520" y="516" width="240" height="3" rx="1.5" fill="url(#titleGrad)" opacity="0.85"/>
</svg>
